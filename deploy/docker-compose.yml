name: veilops-cloud-core

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: veilops
      POSTGRES_USER: veilops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veilops_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../cloud/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veilops -d veilops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  cloud-api:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    environment:
      DATABASE_URL: postgresql://veilops_app:veilops_app_dev_only@postgres:5432/veilops
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
